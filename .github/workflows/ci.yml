name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version consistency
        run: python3 scripts/check_version.py

  test:
    runs-on: ubuntu-latest
    strategy:
      # 一个 Python 版本失败不取消其他版本 —— 否则 3.11 挂了 3.12 会直接被取消，
      # 就看不出「只有 3.11 有问题」还是「两个都挂了」。
      fail-fast: false
      matrix:
        # 3.13 于 2026-09-26 加入：pyproject 声明 requires-python = ">=3.11"，
        # 但此前只测到 3.12，意味着 3.13+ 属于“声称支持却未验证”。
        # 本机 Python 3.14 跑全部 311 个测试通过，是本次扩测的依据。
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[test]"

      # 查全仓库，不只 trade_pipeline/ 与 tests/ —— 此前 scripts/ 与 examples/
      # 下的 Python 文件不被检查（含 CI 自己在用的 scripts/check_version.py）。
      - name: Lint with ruff
        run: ruff check .

      # 覆盖率门槛不写在这里：它在 pyproject.toml 的 [tool.coverage.report] fail_under，
      # 本地 pytest --cov 与 CI 受同一处配置管理。
      - name: Run tests
        run: pytest tests/ -v --cov=trade_pipeline --cov-report=term
